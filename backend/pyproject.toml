[project]
name = "thinkback"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=3.2,<4.0",
    "email-validator>=2.0",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "groq>=1.7.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.3.0",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.0",
    "torch==2.8.0",
    "uvicorn>=0.54.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.1.1",
]
